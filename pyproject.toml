[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xgen-agent-memory"
version = "1.7.0"
description = "Synapse — a learnable, lightweight graph-traversal memory engine: BM25 + local static embeddings + typed-edge PageRank + an online-learned ranker, in one SQLite file with zero API calls."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "CocoRoF" }]
keywords = ["memory", "agent", "retrieval", "bm25", "graph", "pagerank", "online-learning", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/PlateerLab/xgen-agent-memory"
Repository = "https://github.com/PlateerLab/xgen-agent-memory"
Changelog = "https://github.com/PlateerLab/xgen-agent-memory/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/xgen_agent_memory"]

[tool.ruff]
line-length = 100
target-version = "py310"

# 규칙 집합을 고정한다. 안 고정하면 ruff 버전이 올라갈 때마다 새 규칙이 켜져
# 게이트가 코드 변경 없이 빨개진다 (여기서도 UP/C4/BLE 등 244건이 그렇게 떴다).
# 레이아웃은 포매터가 소유하므로 E501 은 제외.
[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E701"]
"src/xgen_agent_memory/ranker.py" = ["E702"]
"src/xgen_agent_memory/embedder.py" = ["E702"]
"src/xgen_agent_memory/engine.py" = ["E702"]
