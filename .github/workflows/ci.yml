name: CI — xgen-agent-memory

# 이 워크플로는 원래 geny-executor 의 CI 를 복사해 온 것이었다. 그래서 이
# 저장소에 없는 경로(src/geny_executor/core, scripts/gen_event_docs.py)를
# 참조했고 2026-07 부터 계속 실패해 왔다 — 검증 게이트가 사실상 없었다.
# 이 저장소의 실제 구조에 맞게 다시 쓴다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -q --tb=short
